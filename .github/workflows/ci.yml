name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --workspaces --legacy-peer-deps

      - name: Build frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci --prefix backend --legacy-peer-deps

      - name: Backend: run build/tests (if present)
        run: |
          npm --prefix backend run build || echo 'no build script for backend'
          npm --prefix backend test || echo 'no tests for backend'
